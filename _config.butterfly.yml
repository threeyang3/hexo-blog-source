# Butterfly theme overrides
# Keep only site-specific values here. Defaults come from
# node_modules/hexo-theme-butterfly/_config.yml.
# Upgrade guide: https://butterfly.js.org/posts/21cfbf15/

nav:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  Home: / || fas fa-home
  All: /archives/ || fas fa-archive
  Articles||fas fa-list:
    Tags: /tags/ || fas fa-tags
    Categories: /categories/ || fas fa-pencil
  Douban||fas fa-list:
    Books: /books/ || fas fa-book
    Movies: /movies/ || fas fa-film
  Others||fas fa-list:
    Link: /link/ || fas fa-link

code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-zhihu: https://www.zhihu.com/people/foolish-36-15 || 知乎
  fab fa-github: https://github.com/threeyang3 || GitHub
  fas fa-envelope: mailto:2499436961@qq.com || Email

favicon: /img/logo.ico

avatar:
  img: /img/4261.JPG
  effect: false

disable_top_img: false
default_top_img: 'linear-gradient(20deg, #0062be, #925696, #cc426e, #fb0347)'
index_img: /img/bk1.webp
footer_img: false

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/bk2.webp

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: Page Not Found
  background: /img/error-page.png

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 今日事&#44;今日毕
    - Never put off till tomorrow what you can do today

index_layout: 3
index_post_content:
  method: 3
  length: 500

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

noticeOutdate:
  enable: false
  style: flat
  limit_day: 500
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/threeyang3
  card_announcement:
    enable: true
    content: 很感谢你看我的文章，期待你的反馈。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: true
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2022/07/03 00:00:00

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 3
    unescape: false
    CDN:

# Comments were intentionally disabled in 2026. Valine credentials and its
# unused npm dependency were removed during maintenance.
comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

preloader:
  enable: false
  source: 1

lazyload:
  enable: true
  native: true
  field: post
  placeholder:
  blur: false

display_mode: light

beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#F47466'

font:
  font_family: '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif'

blog_title_font:
  font_family: '"SimSun", "宋体", "STSong", "华文宋体", serif'

canvas_nest:
  enable: false
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

click_heart:
  enable: false
  mobile: false

lightbox: fancybox

Open_Graph_meta:
  enable: true

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
