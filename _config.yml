# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Threeyang's blog
subtitle:
description: '青山遮不住，毕竟东流去'
keywords: 读书 写作 计算机
author: 言照
language: zh_CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://threeyang.top
# permalink: :year/:month/:day/:title/
permalink: posts/:abbrlink/ #blog/:abbrlink.html
abbrlink:
  alg: crc16 #算法： crc16(default) and crc32
  rep: hex #进制： dec(default) and hex
#permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

encrypt:
  abstract: 本文内容已加密，需要密码后继续阅读。
  message: 请输入密码
  wrong_pass_message: 密码错误，请重新输入。
  autoSave: false
  stableSalt: false
  kdf:
    iterations: 600000

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Discovery
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

douban:
  id: 257442526
  builtin: true # 选择是否有主题渲染
  book:
    title: '读书清单'
    quote: '欢迎大家和我交流看过的书！“在读”和“想读”大部分也都读过~'
  movie:
    title: '电影清单'
    quote: '欢迎大家和我交流看过的电影'
  #game:
  #  title: '游戏清单'
  #  quote: 'This is my game quote'
  timeout: 10000

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Server
## Docs: https://hexo.io/docs/server.html
server:
  port: 5000
  log: true

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type:  'git'
  repo: https://github.com/threeyang3/threeyang3.github.io.git
  branch: master
